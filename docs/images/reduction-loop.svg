<svg xmlns="http://www.w3.org/2000/svg" width="600" height="230" viewBox="0 0 600 230" role="img" aria-labelledby="title desc">
<title id="title">Keep only smaller candidates that preserve the failure</title><desc id="desc">Try removing a piece of the current case. If it is smaller and preserves the same failure, keep the edit and repeat. Otherwise discard the edit and try another candidate.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker><marker id="keep" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/></marker></defs>
<rect x="1" y="1" width="598" height="228" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
<g font-family="Arial, Helvetica, sans-serif"><rect x="20" y="75" width="160" height="80" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
<text x="100" y="110" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">Current case</text><text x="100" y="137" text-anchor="middle" font-size="18" fill="#334155">keep the failure</text>
<rect x="210" y="75" width="160" height="80" rx="12" fill="#ecfeff" stroke="#0e7490" stroke-width="1.5"/>
<text x="290" y="110" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">Try an edit</text><text x="290" y="137" text-anchor="middle" font-size="18" fill="#334155">remove a piece</text>
<rect x="400" y="75" width="180" height="80" rx="12" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/>
<text x="490" y="108" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Smaller +</text><text x="490" y="136" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">same failure?</text>
<g fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"><path d="M 186 115 H 202"/><path d="M 376 115 H 392"/><path d="M 490 163 V 200 H 290 V 163"/></g>
<path d="M 490 67 V 30 H 100 V 67" fill="none" stroke="#0f766e" stroke-width="2.5" marker-end="url(#keep)"/>
<rect x="190" y="17" width="210" height="26" rx="8" fill="#f8fafc"/><text x="295" y="36" text-anchor="middle" font-size="17" font-weight="700" fill="#0f766e">YES · KEEP EDIT</text>
<rect x="304" y="187" width="174" height="26" rx="8" fill="#f8fafc"/><text x="391" y="206" text-anchor="middle" font-size="17" font-weight="700" fill="#475569">NO · DISCARD EDIT</text></g></svg>